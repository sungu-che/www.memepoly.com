									}

								$wallet.removeClass("loading")

									try{

											params: [window.tx.params]

												body : {
													hash : cookies.hash,
													token : cookies.token,

													sign : JSON.stringify(window.tx.sign),

											}, async function(res){

														method: 'eth_getTransactionReceipt',

															$wallet.removeClass("loading")

															OAuth3.fetch({
																method : "POST",
																url : api_host,
																query : {
																	chain : networkName,
																	referer : "https://oauth.email/"
																},
																body : {
																	hash : cookies.hash,
																	token : cookies.token,
																	signature : window.tx.signature,
																	sign : JSON.stringify(window.tx.sign),
																	tx : txHash
																}
															}, async function(res){
																window.location.reload()
															})
														}

									}
								}
							}
						})

						OAuth3.on("keyup", function(e){
							var $this = e.target

							if($this.closest('.tx-address')){
								if($this.name == "from" || $this.name == "to"){
									var $wallet = $("wallet")
									
									var _address = $this.value

									var layer = $wallet.attr("layer")
								
									_address = _address.toLowerCase()

									if(ethers.isAddress(_address)){
										$this.className = ""

										var icon = blockies.create({seed: _address})

										var $icon = document.querySelector('form.'+layer+' .tx-to .icon')

										$icon.innerHTML = '<div class="token"><em class="amount"></em><span></span></div>'
										$icon.appendChild(icon)
									}else{
										$this.className = "type_error"

										var icon = blockies.create({seed: ethers.ZeroHash})

										var $icon = document.querySelector('form.'+layer+' .tx-to .icon')

										$icon.innerHTML = '<div class="token"><em class="amount"></em><span></span></div>'
										$icon.appendChild(icon)
									}
								}
							}
						})


						OAuth3.on("change", function(e){
							var $this = e.target
							var $form = $this.closest('form[name="oauth.network"]')
							
							if($form){
								var to = $form.getAttribute("to")
								var client = $form.getAttribute("client")
								var contenteditable = $form.getAttribute("contenteditable") ? true : false
								
								var $details = $this.closest('details')

								if($details){
									var query = {
										from : contenteditable ? to : client,
										to : contenteditable ? client : to,
									}

									var subject = document.querySelector('[name="query.subject"]').value

									var started = document.querySelector('[name="query.started"]').value
									var expired = document.querySelector('[name="query.expired"]').value

									var booking = document.querySelector('[name="query.booking"]').value
									var search = ""

									var filter = false

									if(subject){
										filter = true
										
										query.subject = subject
									}

									if(booking){
										filter = true
										if(search.length == 0){
											search += "?"
										}else{
											search += "&"
										}

										search += "id="+booking
									}

									if(started){
										filter = true
										query.started = started
									}

									if(expired){
										filter = true
										query.expired = expired
									}

									if(filter){
										if(OAuth3.localhost){
											query.cc = "http://"+OAuth3.localhost+window.location.pathname+search
											query.flag = "#tag "+OAuth3.localhost+" "+window.location.pathname+" "+search
										}

										OAuth3.fetch({
											method : "GET",
											url : OAuth3.host,
											query : query
										}, function(res){
											var $tbody = $details.querySelector("tbody")

											var tbody = ""

											if(res.body){
												if(res.body.rows){
													console.log("res.body.rows",res.body.rows)

													if(res.body.rows.length){
														// 다음 버튼 추가하기
														// cc 주소 기반으로
														
														// 상담이 아니면 기존 기록을 다음 버튼으로 바꿔서 보여주기
													}
												}
											}
										})
									}
								}
							}
						})
				}else{
					window.location.href = "/"
				}

				var $collection = document.querySelector(".collection");
				var x = 0, y = 0, top = 0, left = 0;

				var draggingFunction = function(e){
					document.addEventListener('mouseup', function() {
						document.removeEventListener("mousemove", draggingFunction);
					});

					$collection.scrollLeft = left - e.pageX + x;
					$collection.scrollTop = top - e.pageY + y;
				};

				$collection.addEventListener('mousedown', function(e){
					e.preventDefault();

					y = e.pageY;
					x = e.pageX;
					top = $collection.scrollTop;
					left = $collection.scrollLeft;

					document.addEventListener('mousemove', draggingFunction);
				});
			})()
		</script>
